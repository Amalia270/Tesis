# Configuracion principal de la plantilla FACSO.
# Lee los comentarios para saber donde activar o desactivar opciones rapidas.

project:
  type: book
  output-dir: docs        # Cambia si publicas el libro en otra carpeta (ej. dist/)
  resources:
    - assets/favicon-2025-20251031.svg  # Asegura que el favicon versionado llegue a docs/

book:
  title: Reportes FACSO 
  subtitle: Entrega 1
  output-file: reportes-facso-plantilla
  repo-url: https://github.com/KAravena/reportesfacsobook_template  #URL del repositorio del libro (cambia segun tu repo)
  author:
    - name: Amalia Tsukame
      affiliation: Departamento de Sociologia, Universidad de Chile
      orcid: 0000-0000-0000-0000
    - name: Elisa Calderón 
      affiliation: Departamento de Sociologia, Universidad de Chile
      orcid: 0000-0000-0000-0000
  date: 2026-09-10          # Usa fecha fija (YYYY-MM-DD) si necesitas control editorial
  date-format: D [de] MMMM [de] YYYY
  doi: ""
  sidebar:
    style: docked
    search: true
    collapse-level: 2
    pinned: true
    logo: assets/cover.png # Logo que aparece en el panel lateral
  downloads:
    - pdf
  search: true             # Cambia a false si no quieres la caja de busqueda global
  repo-actions: []         # Agrega ['source', 'issue'] si deseas botones de GitHub
  page-navigation: true    # Controla flechas siguiente/anterior en la cabecera
  favicon: assets/favicon-2025-20251031.svg  # Apunta al favicon versionado para romper cache
  chapters:
    - index.qmd           # Capitulo inicial o resumen ejecutivo
    - 01-definicion-del-problema.qmd
    - 02-objeto-de-estudio.qmd
    - 03-pregunta-de-investigacion.qmd
    - 04-revision-inicial-de-literatura.qmd
    - 05-propuesta-metodologica.qmd
    - 06-disponibilidad-datos.qmd
    - 07-referencias-biblograficas.qmd 
    # Para agregar un nuevo capitulo duplica un archivo .qmd y agregalo aqui:
    # ej: - 07-analisis-cualitativo.qmd

csl: refs/apa.csl                # Estilo de citas (cambia a otro .csl si lo prefieres)
bibliography: refs/referencias.bib
link-citations: true             # Enlaces desde el texto hacia la bibliografia
reference-location: section      # Citas agrupadas al final de cada seccion

format:
  html:
    page-layout: full 
    theme:
      light: cosmo
    toc: true
    toc-depth: 3
    toc-location: right
    number-sections: true
    code-copy: true
    code-tools: true
    df-print: paged
    css: assets/styles.scss
    favicon: assets/favicon-2025-20251031.svg
    anchor-sections: true
    smooth-scroll: true
    link-external-newwindow: true

    include-in-header:
      - includes/justify.html

    include-after-body:
      - includes/logo-link.html
      - includes/citefix.html
      - includes/renumber.html
      - includes/code-toggle.html
      - includes/toc-enhance.html

  pdf:
    pdf-engine: xelatex
    toc: false
    lof: false
    lot: false
    keep-tex: true
    documentclass: scrbook
    classoption:
      - oneside
    papersize: a4
    geometry:
      - top=25mm
      - bottom=25mm
      - left=30mm
      - right=20mm
    colorlinks: true
    number-sections: true
    include-in-header: includes/preamble.tex
    include-before-body: includes/title-pdf.tex
    include-after-body: includes/backmatter.tex
    fig-cap-location: top
    tbl-cap-location: top

execute:
  echo: true                    # Cambia a false si quieres ocultar codigo por defecto
  warning: false
  message: false
  freeze: auto                  # Usa true para congelar resultados, false para ejecutar siempre
  fig-path: "docs/figures/"

lang: es

crossref:
  appendix-title: Anexo
  appendix-delim: " - "

metadata-files:
  - _metadata.yml               # Ajustes adicionales (palabras clave, portada, etc.)

# Estructura complementaria sugerida:
# input/         -> insumos (data-orig, data-proc, imagenes, bib, prereg)
# procesamiento/ -> cuadernos de preparacion y analisis
# output/        -> tablas y graficos listos para el libro
